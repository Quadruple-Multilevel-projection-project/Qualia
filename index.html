<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ממיין משפטים אונטולוגי - AMNE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; background-color: #020617; color: #f8fafc; }
        .logic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .prop-card { background: rgba(30, 41, 59, 0.5); border: 1px solid #1e293b; transition: all 0.3s; position: relative; overflow: hidden; }
        .prop-active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.2); box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .semantic-error { border-color: #ef4444 !important; background: rgba(239, 68, 68, 0.1) !important; }
        .node-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body class="p-6">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-b border-slate-800 pb-4 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold text-sky-400">ממיין משפטים אונטולוגי</h1>
                <p class="text-slate-400">סיווג בזמן ריצה לפי 'מילות הגיון' | אכיפת תחביר סמנטי</p>
            </div>
            <div id="stats" class="text-xs font-mono text-sky-500">SEMANTIC_GUARD: ACTIVE</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-1 space-y-4">
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <label class="block text-sm font-bold mb-2">הזרקת משפט (Instruction):</label>
                    <textarea id="sentenceInput" class="w-full bg-black border border-slate-700 rounded p-3 text-sm focus:border-sky-500 outline-none transition-colors" rows="4" placeholder="למשל: 'כל אדם הוא חי'"></textarea>
                    
                    <div id="semanticAlert" class="hidden mt-2 p-2 bg-red-900/30 border border-red-500/50 rounded text-[10px] text-red-400">
                        ⚠️ שגיאה סמנטית: ניסוח המשפט חסר הגדרה של "חומר" או "כמות".
                    </div>

                    <button onclick="classifySentence()" id="mainBtn" class="w-full mt-3 bg-sky-600 py-2 rounded font-bold hover:bg-sky-500 transition-all flex items-center justify-center gap-2">
                        <span>בצע בירור אונטולוגי</span>
                    </button>
                </div>

                <div id="classificationResult" class="hidden bg-slate-900 p-4 rounded-xl border border-sky-900/50">
                    <h3 class="text-sky-400 font-bold text-sm mb-2">אבחנה לוגית (Type):</h3>
                    <div id="resultDetails" class="text-[11px] space-y-2 text-slate-300"></div>
                </div>
            </div>

            <div class="lg:col-span-3">
                <div class="bg-slate-900/50 p-6 rounded-xl border border-slate-800 min-h-[500px]">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold">מטריצת 104 ההרכבים</h2>
                        <div class="flex gap-4">
                            <div class="flex items-center gap-1"><span class="w-2 h-2 bg-sky-500 rounded-full"></span><span class="text-[10px]">הכרחי</span></div>
                            <div class="flex items-center gap-1"><span class="w-2 h-2 bg-amber-500 rounded-full"></span><span class="text-[10px]">אפשרי (ספק)</span></div>
                            <div class="flex items-center gap-1"><span class="w-2 h-2 bg-red-500 rounded-full"></span><span class="text-[10px]">נמנע</span></div>
                        </div>
                    </div>
                    
                    <div id="matrix" class="logic-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const matrixContainer = document.getElementById('matrix');
        
        function initMatrix() {
            matrixContainer.innerHTML = '';
            for (let i = 1; i <= 104; i++) {
                const div = document.createElement('div');
                div.id = `prop-${i}`;
                div.className = 'prop-card h-14 rounded flex items-center justify-center text-[9px] text-slate-600 text-center p-1 cursor-default border border-slate-800/50';
                div.innerHTML = `<span class="opacity-30">${i}</span>`;
                matrixContainer.appendChild(div);
            }
        }

        async function classifySentence() {
            const text = document.getElementById('sentenceInput').value;
            if (!text) return;

            const btn = document.getElementById('mainBtn');
            const alertBox = document.getElementById('semanticAlert');
            btn.disabled = true;
            alertBox.classList.add('hidden');

            const apiKey = ""; 
            const systemPrompt = `You are a Strict Maimonidean Semantic Guard. 
            Step 1: Validate if the sentence is a proper "Proposition" (משפט) according to Milot HaHigayon. 
            Step 2: If the sentence is vague, missing a quantifer (כל/קצת), or failing to define its modality (Essential vs Accidental), return a semantic error.
            Step 3: If valid, categorize into one of 104 combinations of Quantity (Universal/Particular/Individual), Quality (Affirmative/Negative), and Modality (Necessary/Possible/Impossible).
            Return JSON ONLY: {
                "isValid": boolean,
                "error": "Hebrew error message if invalid",
                "quantity": "...", "quality": "...", "modality": "...", 
                "index": 1-104, 
                "explanation": "Brief Hebrew analysis of the semantic structure"
            }`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                const result = JSON.parse(data.candidates[0].content.parts[0].text);

                if (!result.isValid) {
                    alertBox.innerText = `⚠️ שגיאת ניסוח: ${result.error}`;
                    alertBox.classList.remove('hidden');
                    document.getElementById('classificationResult').classList.add('hidden');
                } else {
                    updateMatrix(result);
                    showResult(result);
                }

            } catch (e) {
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        }

        function updateMatrix(result) {
            document.querySelectorAll('.prop-card').forEach(c => {
                c.classList.remove('prop-active', 'node-pulse');
                c.style.borderColor = '';
            });

            const idx = result.index || Math.floor(Math.random()*104)+1;
            const card = document.getElementById(`prop-${idx}`);
            if (card) {
                card.classList.add('prop-active', 'node-pulse');
                let color = '#38bdf8';
                if (result.modality.includes('אפשרי')) color = '#f59e0b';
                if (result.modality.includes('נמנע')) color = '#ef4444';
                
                card.style.borderColor = color;
                card.innerHTML = `<div style="color:${color}">${result.modality}<br>${result.quantity}</div>`;
            }
        }

        function showResult(result) {
            const resDiv = document.getElementById('classificationResult');
            resDiv.classList.remove('hidden');
            document.getElementById('resultDetails').innerHTML = `
                <div class="p-2 bg-black/40 rounded border-r-2 border-sky-500">
                    <p><strong>מבנה:</strong> ${result.quantity} | ${result.quality}</p>
                    <p><strong>חומר (Logic Type):</strong> ${result.modality}</p>
                </div>
                <p class="text-slate-400 italic">${result.explanation}</p>
            `;
            document.getElementById('stats').innerText = `STRICT_VALIDATION: PASS [ID:${result.index}]`;
        }

        window.onload = initMatrix;
    </script>
</body>
</html>
