version: "3.8"

services:
  gateway:
    build: .
    ports:
      - "3000:3000"
    environment:
      - KERNEL_URL=http://logic_engine:5000
    depends_on:
      - logic_engine

  logic_engine:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "5000:5000"

networks:
  amne_network:
    driver: bridge
